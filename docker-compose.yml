services:
  postgres:
    image: postgres:16
    container_name: bmw_toolkit
    environment:
      POSTGRES_DB: bmwtoolkit
      POSTGRES_USER: bmw
      POSTGRES_PASSWORD: s85b50
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmw -d bmwtoolkit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: bmwtoolkit-r
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30



