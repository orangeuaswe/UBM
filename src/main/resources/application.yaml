spring:
  application:
    name:bmw-buyer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bmwtoolkit}
    username: ${DB_USER:bmw}
    password: ${DB_PASSWORD:s85b50}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        probes:
          enabled: true
    server:
      port: 8080
    toolkit:
      seed:
        enabled: true
      nthsa:
        vpic-base-url: https://vpic.nhtsa.dot.gov/api
        recalls-base-url: https://api.nhtsa.gov
        timeout: 10s
      jobs:
        max-attempts: 4
        initial-backoff: 2s
        backoff-multiplier: 2.0
        refresh-initial-delay: PT1M
        refresh-interval: PT6H
      scoring:
        price: 30
        mileage: 15
        issues: 30
        recalls: 5
        options: 10
        service: 10
        unresolved-total-loss-cap: 60
      alerts:
        webhook-url: ${ALERT_WEBHOOK_URL:}

